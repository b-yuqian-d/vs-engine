name: build
on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-server-web-for-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential g++ libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev python-is-python3

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - run: npm run gulp vscode-server-web-linux-x64-min

      - run: tar -czf vscode-server-web-linux-x64.tar.gz -C .. vscode-server-web-linux-x64

      - uses: actions/upload-artifact@v7
        with:
          path: vscode-server-web-linux-x64.tar.gz
          archive: 'false'

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          token: '${{ secrets.ACCESS_TOKEN_FOR_GITHUB_ACTIONS }}'
          files: vscode-server-web-linux-x64.tar.gz
  build-server-web-for-darwin-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - run: npm run gulp vscode-server-web-darwin-arm64-min

      - run: tar -czf vscode-server-web-darwin-arm64.tar.gz -C .. vscode-server-web-darwin-arm64

      - uses: actions/upload-artifact@v7
        with:
          path: vscode-server-web-darwin-arm64.tar.gz
          archive: 'false'

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          token: '${{ secrets.ACCESS_TOKEN_FOR_GITHUB_ACTIONS }}'
          files: vscode-server-web-darwin-arm64.tar.gz
  build-server-web-for-win32-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - run: npm run gulp vscode-server-web-win32-x64-min

      - run: tar -czf vscode-server-web-win32-x64.tar.gz -C .. vscode-server-web-win32-x64

      - uses: actions/upload-artifact@v7
