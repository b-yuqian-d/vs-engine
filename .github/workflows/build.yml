          path: vscode-server-web-win32-x64.tar.gz
          archive: 'false'

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          token: '${{ secrets.ACCESS_TOKEN_FOR_GITHUB_ACTIONS }}'
          files: vscode-server-web-win32-x64.tar.gz
